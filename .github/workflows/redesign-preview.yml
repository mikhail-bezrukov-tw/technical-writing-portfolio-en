name: Build redesign preview

on:
  push:
    branches:
      - redesign/ru-style
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Configure preview base URL
        run: |
          sed -i "s#baseUrl: '/technical-writing-portfolio-en/'#baseUrl: '/mikhail-bezrukov-tw/technical-writing-portfolio-en/preview-blue-v2/'#" docusaurus.config.js
          sed -i "s#trailingSlash: false#trailingSlash: true#" docusaurus.config.js

      - name: Build preview
        run: npm run build

      - name: Make preview links work on static branch hosting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = r'''<script>
          document.addEventListener('click', function (event) {
            const a = event.target.closest && event.target.closest('a');
            if (!a) return;
            const url = new URL(a.href, window.location.href);
            const base = '/mikhail-bezrukov-tw/technical-writing-portfolio-en/preview-blue-v2/';
            if (url.origin !== window.location.origin || !url.pathname.startsWith(base)) return;
            if (url.hash && url.pathname === base) return;
            if (/\.[a-z0-9]+$/i.test(url.pathname)) return;
            if (url.pathname === base) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            const targetPath = url.pathname.endsWith('/')
              ? url.pathname + 'index.html'
              : url.pathname + '/index.html';
            window.location.assign(targetPath + url.search + url.hash);
          }, true);
          </script>'''
          for path in Path('build').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'Make preview links work on static branch hosting' in text:
                  continue
              text = text.replace('</body>', '<!-- Make preview links work on static branch hosting -->' + script + '</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview-blue-v2
          publish_dir: ./build
          force_orphan: true
