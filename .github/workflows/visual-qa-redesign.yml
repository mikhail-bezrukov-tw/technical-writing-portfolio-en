name: Visual QA redesign

on:
  push:
    branches:
      - redesign/ru-style

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare local preview path
        run: |
          mkdir -p preview-root/technical-writing-portfolio-en
          cp -R build/. preview-root/technical-writing-portfolio-en/

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          python3 -m http.server 8080 --directory preview-root >/tmp/preview.log 2>&1 &
          sleep 2
          npx playwright screenshot --browser=chromium --viewport-size="1440,1400" --full-page http://127.0.0.1:8080/technical-writing-portfolio-en/ screenshots/home-desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="390,1000" --full-page http://127.0.0.1:8080/technical-writing-portfolio-en/ screenshots/home-mobile.png
          npx playwright screenshot --viewport-size="1440,1400" --full-page http://127.0.0.1:8080/technical-writing-portfolio-en/case-studies/ai-screenshot-workflow.html screenshots/case-desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="390,1000" --full-page http://127.0.0.1:8080/technical-writing-portfolio-en/writing-samples/ai-assistant-how-to.html screenshots/doc-mobile.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: redesign-screenshots
          path: screenshots
